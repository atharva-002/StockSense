[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    "frontend",
    "mlruns",
    "backend/artifacts",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # long lines sometimes unavoidable in ML code

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
"ml/train.py" = ["E402"]
